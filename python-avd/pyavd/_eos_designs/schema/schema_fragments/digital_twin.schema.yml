# yaml-language-server: $schema=../../../_schema/avd_meta_schema.json
# Line above is used by RedHat's YAML Schema vscode extension
# Use Ctrl + Space to get suggestions for every field. Autocomplete will pop up after typing 2 letters.
type: dict
keys:
  digital_twin:
    documentation_options:
      table: digital-twin-configuration
    type: dict
    keys:
      environment:
        type: str
        description: |-
          Targeted Digital Twin environment. Available options:
            - act
        valid_values:
          - act
        default: act
      platform:
        type: dict
        keys:
          fabric:
            type: str
            description: |-
              Desired virtual platform for Fabric nodes.
              Available option for ACT:
                - veos
                - cloudeos
            valid_values:
              - veos
              - cloudeos
            default: veos
          endpoints:
            type: str
            description: |-
              Desired virtual platform for Endpoints.
              Available option for act:
                - veos
                - cloudeos
                - generic (Ubuntu Linux)
            valid_values:
              - veos
              - cloudeos
              - generic
            default: veos
      os_version:
        type: dict
        keys:
          fabric:
            type: str
            description: |-
              Desired OS version for Fabric nodes.
          endpoints:
            type: str
            description: |-
              Desired OS version for Endpoints.
      mgmt_ipv4_pool:
        type: dict
        keys:
          fabric:
            type: str
            description: |-
              IPv4 address pool to automatically generate MGMT IPv4 addreesses for Fabric nodes.
              Comma separated list of prefixes (IPv4 address/Mask) or ranges (IPv4_address-IPv4_address).
            format: ipv4_pool
          endpoints:
            type: str
            description: |-
              IPv4 address pool to automatically generate MGMT IPv4 addreesses for Endpoints.
              Comma separated list of prefixes (IPv4 address/Mask) or ranges (IPv4_address-IPv4_address).
            format: ipv4_pool
      username:
        type: dict
        keys:
          fabric:
            type: str
            description: |-
              Username for Fabric nodes.
          endpoints:
            type: str
            description: |-
              Username for Endpoints.
      password:
        type: dict
        keys:
          fabric:
            type: str
            description: |-
              Password for Fabric nodes.
          endpoints:
            type: str
            description: |-
              Password for Endpoints.
