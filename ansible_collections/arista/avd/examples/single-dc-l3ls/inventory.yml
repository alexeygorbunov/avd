---
all:
  children:
    CLOUDVISION:
      hosts:
        cvp:
          # Ansible variables used by the ansible_avd and ansible_cvp roles to push configuration to devices via CVP
          ansible_host: 192.168.1.12
          ansible_user: ansible
          ansible_password: ansible
          ansible_connection: httpapi
          ansible_httpapi_use_ssl: true
          ansible_httpapi_validate_certs: false
          ansible_network_os: eos

    FABRIC:
      children:
        DC1:
          children:
            DC1_SPINES:
              hosts:
                dc1-spine1:
                  # ansible_host: "{{ lookup('env', 'SINGLE_DC_L3LS_DC1_SPINE1') or '172.16.1.11' }}"
                  ansible_host: 172.16.1.11
                dc1-spine2:
                  # ansible_host: "{{ lookup('env', 'SINGLE_DC_L3LS_DC1_SPINE2') or '172.16.1.12' }}"
                  ansible_host: 172.16.1.12
            DC1_L3_LEAVES:
              hosts:
                dc1-leaf1a:
                  # ansible_host: "{{ lookup('env', 'SINGLE_DC_L3LS_DC1_LEAF1A') or '172.16.1.101' }}"
                  ansible_host: 172.16.1.101
                dc1-leaf1b:
                  # ansible_host: "{{ lookup('env', 'SINGLE_DC_L3LS_DC1_LEAF1B') or '172.16.1.102' }}"
                  ansible_host: 172.16.1.102
                dc1-leaf2a:
                  # ansible_host: "{{ lookup('env', 'SINGLE_DC_L3LS_DC1_LEAF2A') or '172.16.1.103' }}"
                  ansible_host: 172.16.1.103
                dc1-leaf2b:
                  # ansible_host: "{{ lookup('env', 'SINGLE_DC_L3LS_DC1_LEAF2B') or '172.16.1.104' }}"
                  ansible_host: 172.16.1.104
            DC1_L2_LEAVES:
              hosts:
                dc1-leaf1c:
                  # ansible_host: "{{ lookup('env', 'SINGLE_DC_L3LS_DC1_LEAF1C') or '172.16.1.151' }}"
                  ansible_host: 172.16.1.151
                dc1-leaf2c:
                  # ansible_host: "{{ lookup('env', 'SINGLE_DC_L3LS_DC1_LEAF2C') or '172.16.1.152' }}"
                  ansible_host: 172.16.1.152

    NETWORK_SERVICES:
      children:
        DC1_L3_LEAVES:
        DC1_L2_LEAVES:
    CONNECTED_ENDPOINTS:
      children:
        DC1_L3_LEAVES:
        DC1_L2_LEAVES:
