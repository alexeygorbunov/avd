metadata:
  platform: cloudeos
  fabric_name: FABRIC
  digital_twin:
    environment: act
    node_type: cloudeos
    ip_addr: 172.16.1.151/24
    version: 4.33.2F
    username: act_user
    password: act_pass
port_channel_interfaces:
- name: Port-Channel1
  description: L2_DC1_L3_LEAF1_Port-Channel8
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: none
prompt: virtual_friendly_prompt
service_routing_protocols_model: multi-agent
transceiver_qsfp_default_mode_4x10: true
