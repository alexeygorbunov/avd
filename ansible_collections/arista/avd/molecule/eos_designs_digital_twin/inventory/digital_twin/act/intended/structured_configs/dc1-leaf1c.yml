aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: L2_dc1-leaf1a_Ethernet8
  shutdown: false
  channel_group:
    id: 1
    mode: active
  peer: dc1-leaf1a
  peer_interface: Ethernet8
  peer_type: l3leaf
- name: Ethernet2
  description: L2_dc1-leaf1b_Ethernet8
  shutdown: false
  channel_group:
    id: 1
    mode: active
  peer: dc1-leaf1b
  peer_interface: Ethernet8
  peer_type: l3leaf
- name: Ethernet5
  description: SERVER_dc1-leaf1-server1_iLO
  shutdown: false
  peer: dc1-leaf1-server1
  peer_interface: iLO
  peer_type: server
  switchport:
    enabled: true
hostname: dc1-leaf1c
ip_igmp_snooping:
  globally_enabled: true
is_deployed: true
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.1.151/24
