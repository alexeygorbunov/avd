!
no enable password
no aaa root
!
prompt virtual_friendly_prompt
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc1-leaf1c
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel1
   description L2_DC1_L3_LEAF1_Port-Channel8
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
!
interface Ethernet1
   description L2_dc1-leaf1a_Ethernet8
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_dc1-leaf1b_Ethernet8
   no shutdown
   channel-group 1 mode active
!
interface Ethernet11
   description SERVER_DC1-LEAF1-SERVER3_Eth3
   no shutdown
   switchport
!
interface Ethernet31
   no shutdown
   switchport mode access
   switchport
   spanning-tree portfast
!
interface Ethernet33
   no shutdown
   switchport mode access
   switchport
   spanning-tree portfast
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.1.151/24
no ip routing vrf MGMT
!
ntp server ntp_server_for_virtual_nodes_only.ntp.org
!
end
