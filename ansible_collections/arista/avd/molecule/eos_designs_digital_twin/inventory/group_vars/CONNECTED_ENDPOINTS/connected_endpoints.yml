---
servers:
  - name: dc1-leaf1-server1
    adapters:
      - endpoint_ports: [PCI1, PCI2]
        switch_ports: [Ethernet5, Ethernet5]
        switches: [dc1-leaf1a, dc1-leaf1b]
        l2_mtu: 10010
        l2_mru: 10020

      - endpoint_ports: [iLO]
        switch_ports: [Ethernet5]
        switches: [dc1-leaf1c]
        poe:
          reboot:
            action: maintain

  - name: dc1-leaf2-server1
    adapters:
      - endpoint_ports: [PCI1, PCI2]
        switch_ports: [Ethernet5, Ethernet5]
        switches: [dc1-leaf2a, dc1-leaf2b]
        poe:
          reboot:
            action: maintain
        l2_mtu: 10010
        l2_mru: 10020

      - endpoint_ports: [iLO]
        switch_ports: [Ethernet5]
        switches: [dc1-leaf2c]
        poe:
          reboot:
            action: maintain
