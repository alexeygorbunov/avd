!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$MIU0emRg9c.0IznA$uj3Y.TRvmcTJHhjiWrSM7pHlrT/d/MLLI.izGHhu2PSu9vhPoUznc5mJwaV73V.q1InLUXl5FwSKGNkXPw/6V1
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -cvaddr=apiserver.cv-staging.corp.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=MGMT -taillogs -disableaaa
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc1-leaf1c
ip name-server vrf MGMT 10.90.231.26
!
spanning-tree mode mstp
spanning-tree mst 0 priority 32768
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel1
   description L2_DC1_L3_LEAF1_Port-Channel8
   no shutdown
   switchport trunk allowed vlan 11-12,21-22,3401-3402
   switchport mode trunk
   switchport
!
interface Ethernet1
   description L2_dc1-leaf1a_Ethernet8
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_dc1-leaf1b_Ethernet8
   no shutdown
   channel-group 1 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.90.231.74/24
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 10.90.231.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 0.pool.ntp.org prefer
ntp server vrf MGMT 1.pool.ntp.org
!
end
